[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darktable-launcher"
version = "0.0.1"
description = "Launcher for Darktable catalogues"
authors = [{ name = "Lurker_pas" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
darktable-launcher = "darktable_launcher.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
